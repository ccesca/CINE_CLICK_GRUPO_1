    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ingresar</title>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="/imagenes/iconoLOGO.png">
        <script src="/js/ingresar.js"></script>
    </head>

    <body>

        <div class="marco_nav">
            <header class="navbar">

                <a href="/index.html">
                    <img class="logo" src="/imagenes/LOGO.png" alt="logo">
                </a>

                <div class="barra-titulo">
                    <p class="secciones">INGRESAR</p>

                    <div class="cerrar">
                        <a href="/index.html">
                            <img src="/imagenes/salirCLARO.png" alt="volver" width="70px">
                        </a>
                    </div>
                </div>

            </header>
        </div>


        <main class="ingresar">

            <div class="alerta-exito" id="mensaje_exito_login">
                <div class="marco">
                    <p class="secciones">Inicio de sesion exitoso</p>
                </div>
            </div>

            <div class="alerta-exito" id="mensaje_exito_registro">
                <div class="marco">
                <p class="secciones">Cuenta creada de forma exitosa</p>
                </div>
            </div>

            <div class="marco">
                <div class="inicio_sesion">

                    <p class="secciones">INICIAR SESIÓN</p>

                    <form class="login_formulario" id="form_login">

                        <div class="login_campo">
                            <label for="Nom_usuario">Usuario</label>
                            <input type="text" name="Nom_usuario" id="usuario" placeholder="Nombre de usuario" required>
                        </div>
                        

                        <div class="login_campo">
                            <label for="contraseña">Contraseña</label>
                            <input type="password" name="contraseña" id="contraseña_login" placeholder="Ingresá tu contraseña" required>
                        </div>

                        <button type="submit" class="boton_secundario" id="btn_login">INICIAR SESIÓN</button>

                    </form>


                </div>
            </div>

            <div class="marco">
                <div class="registro">

                    <p class="secciones">CREAR CUENTA</p>

                    <form class="registro_formulario" id="form_registro">

                        <div class="login_campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre_registro" placeholder="Ingresá tu nombre" required>
                        </div>

                        <div class="login_campo">
                            <label for="usuario">Usuario</label>
                            <input 
                                type="text" 
                                id="usuario_registro" 
                                placeholder="Ingresá tu usuario" 
                                required
                            >
                        </div>

                        <div class="login_campo">
                            <label for="email">Correo electrónico</label>
                            <input 
                                type="email" 
                                id="correo_registro" 
                                placeholder="nombre@correo.com" 
                                required
                            >
                        </div>

                        <div class="login_campo">
                            <label for="password">Contraseña</label>
                            <input 
                                type="password" 
                                id="contraseña_registro" 
                                placeholder="Ingresá una contraseña" 
                                required
                            >
                        </div>

                        <div class="login_campo">
                            <label for="confirmar_password">Confirmar contraseña</label>
                            <input 
                                type="password" 
                                id="confirmar_contraseña_registro" 
                                placeholder="Repetí tu contraseña" 
                                required
                            >
                        </div>

                        <button type="submit" class="boton_secundario" id="btn_registro">REGISTRARSE</button>

                    </form>

                    

                </div>
            </div>

        
        </main>

    </body>
    </html>
