<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | CineClick</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="marco_nav">
        <header class="navbar">

            <a href="/index.html">
                <img class="logo" src="/imagenes/LOGO.png" alt="logo">
            </a>

            <div class="barra-titulo">
                <p class="secciones">REGISTRARSE</p>

                <div class="cerrar">
                    <a href="/index.html">
                        <img src="/imagenes/salirCLARO.png" alt="volver" width="70px">
                    </a>
                </div>
            </div>

        </header>
    </div>

    <main class="ingresar">

        <div class="marco">
            <div class="registro">

                <p class="secciones">CREAR CUENTA</p>

                <p>Registrate para disfrutar de CineClick.</p>

                <form class="registro_formulario">

                    <div class="login_campo">
                        <label for="nombre">Nombre</label>
                        <input 
                            type="text" 
                            id="nombre" 
                            placeholder="Ingresá tu nombre" 
                            required
                        >
                    </div>

                    <div class="login_campo">
                        <label for="apellido">Apellido</label>
                        <input 
                            type="text" 
                            id="apellido" 
                            placeholder="Ingresá tu apellido" 
                            required
                        >
                    </div>

                    <div class="login_campo">
                        <label for="email">Correo electrónico</label>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="nombre@correo.com" 
                            required
                        >
                    </div>

                    <div class="login_campo">
                        <label for="password">Contraseña</label>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Ingresá una contraseña" 
                            required
                        >
                    </div>

                    <div class="login_campo">
                        <label for="confirmar_password">Confirmar contraseña</label>
                        <input 
                            type="password" 
                            id="confirmar_password" 
                            placeholder="Repetí tu contraseña" 
                            required
                        >
                    </div>

                    <button type="submit" class="boton_secundario">
                        REGISTRARSE
                    </button>

                </form>

                <p>¿Ya tenés una cuenta?</p>

                <a href="/IniciarSesion.html" class="boton_secundario">
                    INICIAR SESIÓN
                </a>

            </div>
        </div>

    </main>

</body>
</html>
